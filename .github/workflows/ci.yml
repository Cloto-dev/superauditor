name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Fixtures
        run: python3 conformance/v1/validate.py
      - name: Tests
        run: uv run --python ${{ matrix.python }} --extra test pytest -q
      - name: The built package runs from a wheel
        run: |
          uv build --wheel
          uvx --python ${{ matrix.python }} --from dist/*.whl superauditor-check --help
